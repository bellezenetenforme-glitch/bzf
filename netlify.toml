# Configuration Netlify pour le site BZF
# Le site est genere par build.mjs : une vraie page par langue (fr, en, es)
# avec son <head> localise, son canonical et ses hreflang.

[build]
  command = "node build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  # Racines de langue vers les pages generees.
  from = "/en"
  to = "/en/"
  status = 301
[[redirects]]
  from = "/es"
  to = "/es/"
  status = 301

[[redirects]]
  # Redirection de secours pour lancer manuellement via curl si besoin.
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200