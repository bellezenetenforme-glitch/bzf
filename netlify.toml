# Configuration Netlify pour le site BZF
# Le site statique (index.html) est servi depuis la racine.
# La fonction serverless (contact) envoie les réponses du formulaire par email via Resend.

[build]
  publish = "."
  functions = "netlify/functions"

# Redirection de secours pour lancer manuellement via curl si besoin.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
